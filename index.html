<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#122523">
<title>스카이 서킷</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101c1b;color:#eef7ee;--ink:#101f1c;--mint:#ccf478;--text:#a6bbb1;--line:#354943;--mono:ui-monospace,monospace}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 90% 0%,#243b33,#101c1b 62%)}
  [hidden]{display:none!important}
  main{width:min(1200px,100% - 38px);margin:auto;padding:22px 0 18px}
  header{display:flex;align-items:center;justify-content:flex-end;margin-bottom:13px}
  h1,h2,p{margin:0}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 206px;gap:13px}
  .stage{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:16/9;border:1px solid #53665c;border-radius:14px;background:linear-gradient(#548d91,#95bfad 58%,#bad0a5)}
  canvas{display:block;width:100%;height:100%;outline:none}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:clamp(22px,5.5vw,66px);background:linear-gradient(90deg,#132822f5 0%,#172c24df 28%,#1429218c 53%,#14292100 87%)}
  .overlay[data-mode="crashed"],.overlay[data-mode="done"],.overlay[data-mode="paused"]{background:linear-gradient(90deg,#132822fa 2%,#132822cc 52%,#13282240)}
  .eyebrow{color:#dbfcaa;font:760 11px var(--mono);letter-spacing:.16em;margin-bottom:10px}
  h1{font-size:clamp(37px,6.4vw,82px);font-weight:850;line-height:1.04;letter-spacing:-.085em;text-wrap:balance}
  h1 span{display:block;color:#d1f686}
  .detail{font-size:clamp(13px,1.6vw,16px);line-height:1.64;color:#e1eae0;max-width:274px;margin:15px 0 22px;word-break:keep-all}
  button{font:inherit;cursor:pointer;touch-action:none}
  button:focus-visible{outline:2px solid #f4ffc2;outline-offset:3px}
  .start{border:0;background:var(--mint);color:#19301e;font-weight:850;padding:10px 20px;border-radius:8px;box-shadow:0 4px 22px #a2ed5444}
  .start:hover{background:#e2ffac}
  .muted-btn,.controls button{border:1px solid var(--line);border-radius:8px;background:#1d302a;color:#e8f4e7;font-size:12px;font-weight:750;padding:8px 12px;min-height:36px}
  button:disabled{opacity:.58;cursor:default}
  .muted-btn[aria-pressed="true"]{border-color:#8ca866;color:var(--mint)}
  aside{display:flex;flex-direction:column;gap:11px}
  .card{border:1px solid var(--line);background:linear-gradient(155deg,#203630,#162822);border-radius:11px;padding:13px}
  .card h2{font-size:12px;line-height:1.1;border-bottom:1px solid var(--line);padding-bottom:10px}
  .gate-count{font:850 34px/1.15 var(--mono);letter-spacing:-.07em;color:var(--mint);margin-top:9px}
  .row{display:flex;justify-content:space-between;gap:7px;margin-top:10px;font-size:12px;color:var(--text)}
  .row b{font-family:var(--mono);color:#edf9ed;text-align:right}
  .health{display:flex;gap:4px}
  .health i{height:9px;width:15px;border-radius:2px;background:#c6ef7a}
  .health i.off{background:#48574c}
  .meter{height:5px;border-radius:4px;background:#344a40;margin:8px 0 14px;overflow:hidden}
  .meter i{display:block;width:0;height:100%;background:var(--mint)}
  .guide{flex:1}
  .guide p{font-size:12px;color:#b9c9bd;line-height:1.6;margin-top:9px;word-break:keep-all}
  .controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
  .controls p{font-size:12px;color:#b6c9be}
  .buttons{display:flex;gap:6px}
  .controls button{min-width:37px}
  .controls button.held{background:#48683b;color:#f1ffdb}
  kbd{font:700 11px var(--mono);padding:2px 5px;border:1px solid #435850;border-radius:4px;color:#f0f5e9}
  .feedback{pointer-events:none;position:absolute;top:12%;left:50%;transform:translateX(-50%);max-width:90%;white-space:nowrap;background:#192c22ef;color:#e1ffac;border:1px solid #ddeba64d;padding:7px 12px;border-radius:6px;font-weight:800;font-size:13px}
  .feedback.miss{color:#ffccaa}
  @media(max-width:760px){
    main{width:calc(100% - 22px);padding-top:12px;display:flex;flex-direction:column}
    .layout{display:contents}
    .stage{aspect-ratio:1.25;min-height:270px}
    header{margin-bottom:10px}
    .overlay{padding:21px}
    .overlay h1{font-size:clamp(36px,10vw,52px)}
    .detail{margin:9px 0 13px;max-width:200px}
    .eyebrow{margin-bottom:6px}
    aside{order:2;margin-top:9px}
    .card{padding:10px}
    .telemetry{display:grid;grid-template-columns:auto 1fr;gap:0 14px;align-items:center}
    .telemetry h2{grid-column:1/-1}
    .gate-count{font-size:26px}
    .meter{margin-bottom:0}
    .guide{display:none}
    .controls{order:1;margin-top:8px}
    .controls p{display:none}
    .buttons{display:grid;grid-template-columns:repeat(4,minmax(33px,1fr)) 1.6fr;width:100%}
    .controls button{min-height:45px;padding:5px}
  }
</style>
</head>
<body>
<main>
  <header>
    <button class="muted-btn" id="audio" type="button" aria-pressed="false">소리 꺼짐</button>
  </header>
  <div class="layout">
    <section class="stage" aria-label="3D 드론 비행 화면">
      <canvas id="view" aria-label="협곡 비행과 공중 게이트"></canvas>
      <div class="feedback" id="feedback" role="status" hidden></div>
      <div class="overlay" id="overlay" data-mode="ready">
        <p class="eyebrow" id="tag">협곡 비행 · 게이트 12개</p>
        <h1 id="title">스카이<span>서킷</span></h1>
        <p class="detail" id="detail">드론을 상하좌우로 움직여 빛나는 게이트를 통과하세요. 세 번 놓치면 비행이 종료됩니다.</p>
        <button class="start" type="button" id="start">비행 시작 ↗</button>
      </div>
    </section>
    <aside aria-label="비행 기록">
      <section class="card telemetry">
        <h2>비행 기록</h2>
        <div class="gate-count" id="passes">00/12</div>
        <div class="meter" aria-hidden="true"><i id="progress"></i></div>
        <div class="row"><span>현재 점수</span><b id="score">0</b></div>
        <div class="row"><span>최고 점수</span><b id="record">0</b></div>
        <div class="row"><span>남은 기회</span><b class="health" id="health" aria-label="3회"><i></i><i></i><i></i></b></div>
        <div class="row"><span>다음 게이트</span><b id="range">—</b></div>
      </section>
      <section class="card guide"><h2>조종 팁</h2><p>게이트 중심에 가깝게 통과하면 추가 점수를 얻습니다. 초록색 링이 지금 통과할 게이트입니다.</p></section>
    </aside>
  </div>
  <div class="controls">
    <p><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 또는 방향키로 이동 · <kbd>P</kbd> 일시 정지</p>
    <div class="buttons">
      <button type="button" data-dir="left" aria-label="왼쪽">←</button>
      <button type="button" data-dir="up" aria-label="위">↑</button>
      <button type="button" data-dir="down" aria-label="아래">↓</button>
      <button type="button" data-dir="right" aria-label="오른쪽">→</button>
      <button type="button" id="pause">일시 정지</button>
    </div>
  </div>
</main>
<script>
'use strict';

const byId = (id) => document.getElementById(id);
const ui = Object.fromEntries(['view','overlay','tag','title','detail','start','audio','feedback','passes','progress','score','record','health','range','pause'].map(id => [id, byId(id)]));
const buttons = [...document.querySelectorAll('[data-dir]')];
const layout = [[0,0],[-5,2],[-8,-1],[0,-3],[7,1],[9,4],[3,5],[-5,0],[-10,-3],[-5,3],[4,1],[10,4]];
const gates = layout.map(([x,y], i) => ({x,y,z:100 + i * 96, radius:i < 2 ? 5.2 : 4.65}));
const storageKey = 'sky-circuit-record-v1';
const clamp = (v, lo, hi) => Math.max(lo,Math.min(hi,v));
const record = () => {
  try { return Math.max(0, Number(localStorage.getItem(storageKey)) || 0); }
  catch { return 0; }
};
const state = {mode:'ready',x:0,y:0,z:0,vx:0,vy:0,clock:0,index:0,passes:0,score:0,lives:3,streak:0,best:record(),noteUntil:0};
const keys = new Set();
const pointerDirections = new Map();
let scene;
let audio;
let sound = false;

function playNote(frequency, duration, volume, endFrequency = frequency) {
  if (!sound || audio?.state !== 'running') return;
  const now = audio.currentTime;
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  oscillator.type = 'triangle';
  oscillator.frequency.setValueAtTime(frequency, now);
  oscillator.frequency.exponentialRampToValueAtTime(endFrequency, now + duration);
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(.001, now + duration);
  oscillator.connect(gain).connect(audio.destination);
  oscillator.start();
  oscillator.stop(now + duration);
}

function begin() {
  if (!scene) return;
  if (state.mode === 'paused') {
    mode('running');
    return;
  }
  Object.assign(state,{x:0,y:0,z:0,vx:0,vy:0,clock:0,index:0,passes:0,score:0,lives:3,streak:0,noteUntil:0});
  ui.feedback.hidden = true;
  mode('running');
  playNote(290,.26,.07,505);
}

function mode(next) {
  state.mode = next;
  const running = next === 'running';
  ui.overlay.hidden = running;
  ui.overlay.dataset.mode = next;
  ui.pause.disabled = !running && next !== 'paused';
  ui.pause.textContent = next === 'paused' ? '계속' : '일시 정지';
  for (const button of buttons) button.disabled = !running;
  if (running) {
    ui.feedback.hidden = state.noteUntil <= state.clock;
  } else {
    keys.clear();
    pointerDirections.clear();
    for (const button of buttons) button.classList.remove('held');
    ui.feedback.hidden = true;
  }
  if (next === 'paused') {
    ui.tag.textContent = '비행 대기';
    ui.title.textContent = '일시 정지';
    ui.detail.textContent = '준비되면 남은 게이트를 향해 다시 날아가세요.';
    ui.start.textContent = '비행 계속';
  } else if (next === 'done' || next === 'crashed') {
    ui.tag.textContent = next === 'done' ? '협곡 코스 종료' : '남은 기회 0회';
    ui.title.textContent = next === 'done' ? '비행 완료' : '비행 종료';
    ui.detail.textContent = '게이트 ' + state.passes + '/' + gates.length + ' 통과 · ' + state.score.toLocaleString('ko-KR') + '점';
    ui.start.textContent = '다시 비행';
  }
  if (!running && next !== 'ready') ui.start.focus({preventScroll:true});
  updateHud();
}

function updateHud() {
  ui.passes.textContent = String(state.passes).padStart(2,'0') + '/' + gates.length;
  ui.progress.style.width = 100 * state.index / gates.length + '%';
  ui.score.textContent = state.score.toLocaleString('ko-KR');
  ui.record.textContent = state.best.toLocaleString('ko-KR');
  ui.health.setAttribute('aria-label',state.lives + '회');
  for (let i=0;i<3;i++) ui.health.children[i].classList.toggle('off',i >= state.lives);
  const gate = gates[state.index];
  ui.range.textContent = gate ? Math.max(0,Math.ceil(gate.z - state.z)) + ' m' : '—';
}

function setFeedback(text, miss = false) {
  ui.feedback.textContent = text;
  ui.feedback.classList.toggle('miss',miss);
  ui.feedback.hidden = false;
  state.noteUntil = state.clock + .95;
}

function resolveGate(gate) {
  const error = Math.hypot(state.x - gate.x,state.y - gate.y) / gate.radius;
  if (error <= .91) {
    state.passes++;
    state.streak++;
    const centered = error <= .42;
    const score = (centered ? 150 : 100) + Math.min(40,(state.streak-1)*10);
    state.score += score;
    setFeedback((centered ? '정중앙 통과' : '게이트 통과') + ' +' + score);
    playNote(centered ? 600 : 480,.24,.12,centered ? 975 : 705);
    if (state.score > state.best) {
      state.best = state.score;
      try { localStorage.setItem(storageKey,String(state.best)); } catch {}
    }
  } else {
    state.lives--;
    state.streak = 0;
    setFeedback('게이트 놓침 · 기회 −1',true);
    playNote(180,.29,.11,75);
  }
  state.index++;
}

function step(dt) {
  state.clock += dt;
  const held = new Set([...keys,...pointerDirections.values()]);
  const dx = Number(held.has('right')) - Number(held.has('left'));
  const dy = Number(held.has('up')) - Number(held.has('down'));
  const easing = Math.min(1,dt*10);
  state.vx += (dx * 14 - state.vx) * easing;
  state.vy += (dy * 11 - state.vy) * easing;
  state.x = clamp(state.x + state.vx * dt,-16.5,16.5);
  state.y = clamp(state.y + state.vy * dt,-7,9);
  state.z += dt * (38 + .9 * state.index);
  if (state.noteUntil <= state.clock) ui.feedback.hidden = true;
  if (state.z >= gates[state.index]?.z) {
    resolveGate(gates[state.index]);
    if (!state.lives) { mode('crashed'); return; }
    if (state.index === gates.length) { mode('done'); return; }
  }
  updateHud();
}

function togglePause() {
  if (state.mode === 'running') mode('paused');
  else if (state.mode === 'paused') mode('running');
}

const directionKey = {w:'up',a:'left',s:'down',d:'right',arrowup:'up',arrowleft:'left',arrowdown:'down',arrowright:'right'};
window.addEventListener('keydown',event => {
  if (event.ctrlKey || event.altKey || event.metaKey) return;
  const key = event.key.toLowerCase();
  if (key === 'p' || key === 'escape') {
    if (!event.repeat && ['running','paused'].includes(state.mode)) { event.preventDefault(); togglePause(); }
    return;
  }
  const direction = directionKey[key];
  if (!direction || state.mode !== 'running') return;
  event.preventDefault();
  keys.add(direction);
});
window.addEventListener('keyup',event => keys.delete(directionKey[event.key.toLowerCase()]));
window.addEventListener('blur',() => { if (state.mode === 'running') togglePause(); });
document.addEventListener('visibilitychange',() => {
  if (document.hidden && state.mode === 'running') togglePause();
});
for (const button of buttons) {
  button.addEventListener('pointerdown',event => {
    if (state.mode !== 'running' || (event.pointerType === 'mouse' && event.button !== 0)) return;
    button.setPointerCapture(event.pointerId);
    pointerDirections.set(event.pointerId,button.dataset.dir);
    button.classList.add('held');
  });
  const release = event => {
    pointerDirections.delete(event.pointerId);
    if (![...pointerDirections.values()].includes(button.dataset.dir)) button.classList.remove('held');
  };
  button.addEventListener('pointerup',release);
  button.addEventListener('pointercancel',release);
  button.addEventListener('lostpointercapture',release);
  button.addEventListener('keydown',event => {
    if (event.key === ' ' || event.key === 'Enter') keys.add(button.dataset.dir);
  });
  button.addEventListener('keyup',event => {
    if (event.key === ' ' || event.key === 'Enter') keys.delete(button.dataset.dir);
  });
  button.addEventListener('blur',() => keys.delete(button.dataset.dir));
}
ui.start.addEventListener('click',begin);
ui.pause.addEventListener('click',togglePause);
ui.audio.addEventListener('click',async () => {
  if (!sound) {
    try {
      const Audio = window.AudioContext || window.webkitAudioContext;
      audio ||= new Audio();
      await audio.resume();
    } catch {
      ui.audio.textContent = '소리 사용 불가';
      return;
    }
  }
  sound = !sound;
  ui.audio.textContent = sound ? '소리 켜짐' : '소리 꺼짐';
  ui.audio.setAttribute('aria-pressed',String(sound));
  playNote(380,.12,.08,650);
});

function buildWebGLRenderer(canvas) {
  const gl = canvas.getContext('webgl',{alpha:true,antialias:true});
  if (!gl) throw Error('WebGL unavailable');
  const vertices = `
    attribute vec3 aPosition;
    attribute vec3 aTint;
    uniform vec3 uCamera;
    uniform vec2 uProjection;
    varying vec3 vTint;
    varying float vDepth;
    void main(){
      vec3 view=aPosition-uCamera;
      view.y+=0.065*view.z;
      gl_Position=vec4(view.x*uProjection.x,view.y*uProjection.y,1.002*view.z-1.001,view.z);
      vDepth=view.z;
      vTint=aTint;
    }`;
  const fragments = `
    precision mediump float;
    varying vec3 vTint;
    varying float vDepth;
    void main(){
      float haze=smoothstep(18.0,365.0,vDepth)*0.93;
      gl_FragColor=vec4(mix(vTint,vec3(.55,.71,.64),haze),1.0);
    }`;
  const program = gl.createProgram();
  for (const [type,source] of [[gl.VERTEX_SHADER,vertices],[gl.FRAGMENT_SHADER,fragments]]) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader,source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader,gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(shader));
    gl.attachShader(program,shader);
  }
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program,gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0,0,0,0);
  const position = gl.getAttribLocation(program,'aPosition');
  const tint = gl.getAttribLocation(program,'aTint');
  const camera = gl.getUniformLocation(program,'uCamera');
  const projection = gl.getUniformLocation(program,'uProjection');
  gl.enableVertexAttribArray(position);
  gl.enableVertexAttribArray(tint);
  const staticBuffer = gl.createBuffer();
  const activeBuffer = gl.createBuffer();
  let landCount = 0;

  function drawBuffer(buffer,count) {
    gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
    gl.vertexAttribPointer(position,3,gl.FLOAT,false,24,0);
    gl.vertexAttribPointer(tint,3,gl.FLOAT,false,24,12);
    gl.drawArrays(gl.TRIANGLES,0,count);
  }

  return {
    prepare(land) {
      landCount=land.length/6;
      gl.bindBuffer(gl.ARRAY_BUFFER,staticBuffer);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(land),gl.STATIC_DRAW);
    },
    render(objects,view) {
      gl.viewport(0,0,view.width,view.height);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.uniform2f(projection,view.scaleX,view.scaleY);
      gl.uniform3f(camera,view.x,view.y,view.z);
      drawBuffer(staticBuffer,landCount);
      gl.bindBuffer(gl.ARRAY_BUFFER,activeBuffer);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(objects),gl.DYNAMIC_DRAW);
      drawBuffer(activeBuffer,objects.length/6);
    }
  };
}

function buildCanvasRenderer(canvas) {
  const context = canvas.getContext('2d',{alpha:false});
  if (!context) throw Error('Canvas unavailable');
  const near = .6;
  const far = 310;
  const sectionSize = 40;
  let terrain;
  let sky;
  let skyWidth = 0;
  let skyHeight = 0;

  function drawSky(width,height) {
    if (skyWidth === width && skyHeight === height) return;
    skyWidth=width;
    skyHeight=height;
    sky=document.createElement('canvas');
    sky.width=width;
    sky.height=height;
    const layer=sky.getContext('2d');
    const atmosphere=layer.createLinearGradient(0,0,0,height*.67);
    atmosphere.addColorStop(0,'#4b8491');
    atmosphere.addColorStop(.53,'#83b3a9');
    atmosphere.addColorStop(1,'#b8cdb0');
    layer.fillStyle=atmosphere;
    layer.fillRect(0,0,width,height);
    const sunX=width*.76,sunY=height*.17,r=height*.135;
    const glow=layer.createRadialGradient(sunX,sunY,0,sunX,sunY,r);
    glow.addColorStop(0,'#ffffd6d9');
    glow.addColorStop(.41,'#fff0bb62');
    glow.addColorStop(1,'#fff0bb00');
    layer.fillStyle=glow;
    layer.fillRect(sunX-r,sunY-r,r*2,r*2);
    layer.beginPath();
    layer.arc(sunX,sunY,r*.28,0,Math.PI*2);
    layer.fillStyle='#faf4ce';
    layer.fill();
    for (let i=0;i<11;i++) {
      const x=width*(.06 + (i*.181)%1);
      const y=height*(.09 + (i*.047)% .2);
      layer.beginPath();
      layer.ellipse(x,y,width*(.025+i%4*.018),height*(.003+i%3*.002),-.08,0,Math.PI*2);
      layer.fillStyle=i%2 ? '#cde1c858' : '#ece9ca68';
      layer.fill();
    }
  }

  function triangles(mesh,view,out) {
    const halfW=view.width/2,halfH=view.height/2;
    for (let i=0;i<mesh.length;i+=18) {
      const z0=mesh[i+2]-view.z,z1=mesh[i+8]-view.z,z2=mesh[i+14]-view.z;
      if (Math.min(z0,z1,z2)>far || Math.max(z0,z1,z2)<=near) continue;
      const vertices=[
        [mesh[i]-view.x,mesh[i+1]-view.y,z0],
        [mesh[i+6]-view.x,mesh[i+7]-view.y,z1],
        [mesh[i+12]-view.x,mesh[i+13]-view.y,z2]
      ];
      const clipped=[];
      for (let j=0;j<3;j++) {
        const a=vertices[j],b=vertices[(j+1)%3];
        if (a[2]>=near) clipped.push(a);
        if ((a[2]<near)!==(b[2]<near)) {
          const t=(near-a[2])/(b[2]-a[2]);
          clipped.push([a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1]),near]);
        }
      }
      const screen=clipped.map(([x,y,z])=>[halfW*(1+x*view.scaleX/z),halfH*(1-(y/z+.065)*view.scaleY)]);
      if (screen.every(p=>p[0]<0) || screen.every(p=>p[0]>view.width) ||
          screen.every(p=>p[1]<0) || screen.every(p=>p[1]>view.height)) continue;
      const depth=(Math.max(near,z0)+Math.max(near,z1)+Math.max(near,z2))/3;
      const t=clamp((depth-18)/337,0,1);
      const fog=t*t*(3-2*t)*.93;
      const color=[.55,.71,.64].map((hue,k)=>Math.min(255,Math.round(255*(mesh[i+3+k]*(1-fog)+hue*fog))));
      out.push({screen,depth,color:'rgb('+color.join(',')+')'});
    }
  }

  return {
    pixelRatio: 1,
    prepare(land) {
      terrain=new Map();
      for (let i=0;i<land.length;i+=18) {
        const depth=Math.min(land[i+2],land[i+8],land[i+14]);
        const key=Math.floor(depth/sectionSize);
        if (!terrain.has(key)) terrain.set(key,[]);
        terrain.get(key).push(...land.slice(i,i+18));
      }
    },
    render(objects,view) {
      drawSky(view.width,view.height);
      context.drawImage(sky,0,0);
      const faces=[];
      for (let key=Math.floor((view.z-20)/sectionSize);key<=Math.floor((view.z+far)/sectionSize);key++) {
        const section=terrain.get(key);
        if (section) triangles(section,view,faces);
      }
      triangles(objects,view,faces);
      faces.sort((a,b)=>b.depth-a.depth);
      for (const {screen,color} of faces) {
        context.beginPath();
        context.moveTo(...screen[0]);
        for (let i=1;i<screen.length;i++) context.lineTo(...screen[i]);
        context.closePath();
        context.fillStyle=color;
        context.fill();
      }
    }
  };
}

function buildScene(canvas) {
  let renderer;
  try {
    renderer=buildWebGLRenderer(canvas);
  } catch {
    const fallback=canvas.cloneNode(false);
    canvas.replaceWith(fallback);
    canvas=fallback;
    renderer=buildCanvasRenderer(canvas);
  }
  const land = [];
  const objects = [];
  const triangle = (target,a,b,c,color) => target.push(...a,...color,...b,...color,...c,...color);
  const quad = (target,a,b,c,d,color) => {
    triangle(target,a,b,c,color);
    triangle(target,a,c,d,color);
  };
  const prism = (target,bottom,top,color) => {
    quad(target,...top,color);
    for (let i=0;i<4;i++) {
      const next = (i+1)%4;
      const shade = [.78,.62,.69,.88][i];
      quad(target,bottom[i],bottom[next],top[next],top[i],color.map(v => v*shade));
    }
  };
  const rectangle = (x,y,z,hx,hz) => [[x-hx,y,z-hz],[x+hx,y,z-hz],[x+hx,y,z+hz],[x-hx,y,z+hz]];
  const box = (target,x,y,z,hx,hy,hz,color) => prism(target,rectangle(x,y-hy,z,hx,hz),rectangle(x,y+hy,z,hx,hz),color);

  const columns = [-155,-112,-82,-60,-46,-34,-24,-16,-9,0,9,16,24,34,46,60,82,112,155];
  const shelf = [53,41,44,24,16,4,-5,-11,-12,-12,-12,-11,-5,4,16,24,44,41,53];
  const terrain = (i,z) => {
    const x = columns[i];
    const edge = Math.min(1,Math.max(0,(Math.abs(x)-10)/18));
    const bend = 3.8*Math.sin(z*.018)+2*Math.sin(z*.006);
    const y = shelf[i]+edge*(5*Math.sin(z*.036+i*1.61)+7*Math.cos(z*.019+i*2.2));
    return [x+bend,y,z];
  };
  for (let z=-38;z<1510;z+=14) {
    const water = [.26+.025*Math.cos(z*.2),.48+.016*Math.sin(z*.18),.47];
    quad(land,[-29,-11.2,z],[29,-11.2,z],[29,-11.2,z+14],[-29,-11.2,z+14],water);
    for (let i=0;i<columns.length-1;i++) {
      const a=terrain(i,z), b=terrain(i+1,z), c=terrain(i+1,z+14), d=terrain(i,z+14);
      const h=(a[1]+b[1]+c[1]+d[1])/4;
      const shade=.93+.13*Math.sin(z*.127+i*9.76);
      const base=h>18 ? [.35,.43,.37] : h>0 ? [.35,.48,.32] : [.29,.43,.35];
      triangle(land,a,b,c,base.map(v=>v*shade));
      triangle(land,a,c,d,base.map(v=>v*shade*.92));
    }
  }
  for (let i=0;i<165;i++) {
    const z=21+i*8.2, side=i%2 ? -1 : 1, j=side>0 ? 12+i%3 : 6-i%3;
    const [x,y]=terrain(j,z);
    const height=2.2+(i*17%23)*.13;
    const size=height*.45;
    const color=[[.14,.31,.23],[.21,.37,.26],[.25,.43,.3]][i%3];
    const bottom=rectangle(x,y-.25,z,size,size);
    const top=[x,y+height,z];
    for (let k=0;k<4;k++) triangle(land,bottom[k],bottom[(k+1)%4],top,color.map(v=>v*(.82+k*.07)));
  }
  for (let z=6;z<1390;z+=21) {
    const x=4*Math.sin(z*.27);
    quad(land,[x-2,-11.15,z],[x+5,-11.15,z],[x+6,-11.15,z+.5],[x-1,-11.15,z+.5],[.46,.66,.58]);
  }

  renderer.prepare(land);

  function ring(gate,isTarget) {
    const color = isTarget ? [.76,1,.41] : [.59,.82,.77];
    const outer = gate.radius + (isTarget ? .42 : .27);
    const point = (angle,r,z) => [gate.x + Math.cos(angle)*r,gate.y + Math.sin(angle)*r,z];
    for (let i=0;i<48;i++) {
      const a=i*Math.PI/24,b=(i+1)*Math.PI/24;
      const light=i%12 < 2 ? 1 : .86;
      const front=gate.z-.37, back=gate.z+.37;
      const ao=point(a,outer,front),bo=point(b,outer,front);
      quad(objects,ao,bo,point(b,gate.radius,front),point(a,gate.radius,front),color.map(v=>v*light));
      quad(objects,ao,point(a,outer,back),point(b,outer,back),bo,color.map(v=>v*.61));
      const ai=point(a,gate.radius,front),bi=point(b,gate.radius,front);
      quad(objects,ai,bi,point(b,gate.radius,back),point(a,gate.radius,back),color.map(v=>v*.72));
    }
    if (!isTarget) return;
    for (const x of [-1,1]) {
      const z=gate.z-.45;
      triangle(objects,[gate.x+x*(outer+2),gate.y-.6,z],[gate.x+x*(outer+2),gate.y+.6,z],[gate.x+x*(outer+.8),gate.y,z],[.94,1,.76]);
    }
  }

  function drone(time) {
    const tilt = state.vx * .027;
    const cosine = Math.cos(tilt), sine = Math.sin(tilt);
    const cockpitY = state.y + Math.sin(time*5)*.10;
    const transform = ([x,y,z]) => [state.x+x*cosine+y*sine,cockpitY+y*cosine-x*sine,state.z+z];
    const part = (x,y,z,hx,hy,hz,hue) => {
      const lo=rectangle(x,y-hy,z,hx,hz).map(transform);
      const hi=rectangle(x,y+hy,z,hx,hz).map(transform);
      prism(objects,lo,hi,hue);
    };
    part(0,0,0,1.02,.23,1.06,[.82,.91,.74]);
    part(0,.30,.05,.56,.15,.66,[.17,.32,.29]);
    part(0,.02,-1.08,.67,.09,.08,[.86,1,.35]);
    for (const side of [-1,1]) {
      part(side*1.1,-.05,.06,.68,.08,.54,[.38,.53,.44]);
      for (const front of [-1,1]) {
        const x=side*1.79,z=front*.80;
        part(x,.04,z,.22,.14,.23,[.21,.32,.29]);
        const spin=time*22*(side*front)+side;
        for (let blade=0;blade<2;blade++) {
          const angle=spin+blade*Math.PI/2;
          const center=[x,.23,z];
          const arc = (a,r) => transform([x+Math.cos(a)*r,center[1],z+Math.sin(a)*r]);
          quad(objects,arc(angle-.12,.84),arc(angle+.12,.84),arc(angle+Math.PI-.12,.84),arc(angle+Math.PI+.12,.84),[.74,.91,.72]);
        }
      }
    }
  }

  return {
    render(time) {
      const pixelRatio=Math.min(renderer.pixelRatio ?? 1.65,devicePixelRatio || 1);
      const width=Math.max(1,Math.round(canvas.clientWidth*pixelRatio));
      const height=Math.max(1,Math.round(canvas.clientHeight*pixelRatio));
      if (canvas.width!==width || canvas.height!==height) {
        canvas.width=width;
        canvas.height=height;
      }
      objects.length=0;
      if (state.mode === 'ready') {
        ring({x:7,y:1.8,z:42,radius:5.7},true);
        ring(gates[1],false);
        ring(gates[2],false);
      } else {
        for (let i=state.index;i<Math.min(state.index+5,gates.length);i++) ring(gates[i],i===state.index);
      }
      drone(time);
      const scale=1.63;
      renderer.render(objects,{
        width,height,scaleX:Math.min(1.39,scale*height/width),scaleY:scale,
        x:state.x*.68,y:state.y*.78+3.6,z:state.z-12.7
      });
    }
  };
}

mode('ready');
try {
  scene=buildScene(ui.view);
} catch {
  ui.tag.textContent='3D 그래픽 연결 실패';
  ui.title.textContent='비행을 열 수 없어요';
  ui.detail.textContent='그래픽을 초기화할 수 없습니다. 브라우저를 새로고침해 주세요.';
  ui.start.disabled=true;
}

if (scene) {
  let last=performance.now();
  let frameTime=0;
  let lastDraw=0;
  let lastMode;
  const quiet=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now) {
    const dt=clamp((now-last)/1000,0,.25);
    last=now;
    const moving=state.mode==='running' || (state.mode==='ready' && !quiet);
    if (state.mode==='running') {
      const count=Math.max(1,Math.ceil(dt/.035));
      for (let i=0;i<count && state.mode==='running';i++) step(dt/count);
    }
    if (moving) frameTime+=dt;
    if (state.mode!==lastMode || now-lastDraw>=1000/30) {
      scene.render(frameTime);
      lastDraw=now;
      lastMode=state.mode;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
